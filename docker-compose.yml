version: '3.9'

services:
  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: signflow-db
    environment:
      SA_PASSWORD: "SignFlow@Dev2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SignFlow@Dev2026!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: signflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MailHog (SMTP for dev)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: signflow-mail
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ClamAV: every uploaded PDF is scanned before it is stored (R-M2-2)
  clamav:
    image: clamav/clamav:1.4
    container_name: legaldesk-clamav
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s   # the first start downloads the signature database

  # Harvey: verified law, risk grid and contract review (M11). The meaning model is baked into the image.
  harvey:
    build:
      context: ./src/legal-corpus
      dockerfile: Dockerfile
    container_name: legaldesk-harvey
    environment:
      CORPUS_API_KEY: "${HARVEY_API_KEY:?Set HARVEY_API_KEY in .env}"
      CORPUS_ADMIN_PASSWORD: "${HARVEY_ADMIN_PASSWORD:?Set HARVEY_ADMIN_PASSWORD in .env}"
      CORPUS_SESSION_SECRET: "${HARVEY_SESSION_SECRET:?Set HARVEY_SESSION_SECRET in .env}"
      CORPUS_AI_PROVIDER: "none"
    ports:
      - "8100:8100"
    volumes:
      - harvey-data:/srv/harvey/data

  # .NET API
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: signflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SignFlowDb;User Id=sa;Password=SignFlow@Dev2026!;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      # Secrets come from the shell or a git-ignored .env file next to this compose file, never from appsettings.
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}"
      Groq__ApiKey: "${GROQ_API_KEY:-}"
      Storage__Provider: "Local"
      Storage__LocalPath: "/app/uploads"
      Email__Host: "mailhog"
      Email__Port: "1025"
      Email__UseSsl: "false"
      Email__Username: ""
      Email__Password: ""
      Email__FromEmail: "noreply@legaldesk.tn"
      Email__FromName: "LegalDesk"
      LegalCorpus__BaseUrl: "http://harvey:8100"
      LegalCorpus__ApiKey: "${HARVEY_API_KEY:?Set HARVEY_API_KEY in .env}"
      Security__PublicUrl: "http://localhost:4200"
      Security__ClamAv__Host: "clamav"
      Security__ClamAv__Required: "true"
      # The web container's nginx forwards the client IP; only this network is believed (signature evidence).
      Security__KnownNetworks__0: "172.28.0.0/16"
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      harvey:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Angular Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: signflow-frontend
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver-data:
  redis-data:
  uploads-data:
  clamav-data:
  harvey-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
