<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app_name') }}{% endblock %}</title>
  <link rel="icon" href="/static/logo-consultim-it.svg">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">
      <img src="/static/logo-consultim-it.svg" alt="Consultim IT">
      <span class="name"><strong>{{ t('app_name') }}</strong><small>{{ t('app_tagline') }}</small></span>
    </a>
    <nav>
      <a href="/">{{ t('nav_texts') }}</a>
      <a href="/import-pdf">{{ t('nav_import_pdf') }}</a>
      <a href="/search">{{ t('nav_search') }}</a>
      <a href="/playbook">{{ t('nav_playbook') }}</a>
      <a href="/docs">{{ t('nav_api') }}</a>
    </nav>
    <span class="langs">
      <a href="/lang/en" class="{{ 'active' if lang == 'en' }}">EN</a>
      <a href="/lang/fr" class="{{ 'active' if lang == 'fr' }}">FR</a>
    </span>
  </div>
</header>
<main>
  {% if flash %}<div class="flash {{ flash_kind }}">{{ t(flash, **flash_args) }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
