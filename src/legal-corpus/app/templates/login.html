{% extends "base.html" %}
{% block title %}{{ t('login_title') }} · {{ t('app_name') }}{% endblock %}
{% block content %}
<form class="card login-card" method="post" action="/login">
  <img src="/static/logo-consultim-it.svg" alt="Consultim IT">
  <h1>{{ t('login_title') }}</h1>
  <p class="muted">{{ t('login_intro') }}</p>
  {% if error %}<div class="flash error">{{ t('login_failed') }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="login">{{ t('login_user') }}</label>
  <input id="login" name="login" autocomplete="username" required autofocus value="{{ login or '' }}">
  <label for="password">{{ t('login_password') }}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="actions"><button type="submit">{{ t('login_submit') }}</button></div>
</form>
{% endblock %}
