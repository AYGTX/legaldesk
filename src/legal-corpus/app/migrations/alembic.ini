# Command-line use only: python -m alembic -c app/migrations/alembic.ini upgrade head
# The database comes from CORPUS_DATABASE_URL (app.config); the application migrates itself at start-up.
[alembic]
script_location = %(here)s
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
