# Security headers for every response (rework spec, security baseline). Included in each location because a
# location that sets any add_header of its own stops inheriting the server-level ones.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# No inline or remote scripts. Styles allow inline because Angular and Angular Material inject <style> elements;
# Google Fonts is the only remote origin (to be self-hosted). data: and blob: cover QR codes and pdf.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
