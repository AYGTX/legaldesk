name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/SignFlow.slnx

      - name: Build
        run: dotnet build src/backend/SignFlow.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/SignFlow.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

  harvey:
    name: Harvey Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/legal-corpus
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/legal-corpus/requirements*.txt

      # CPU-only PyTorch keeps the install small; the meaning model (~470 MB) is cached between runs so the
      # review regression tests run instead of skipping.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/legal-corpus/requirements-semantic.txt') }}

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r requirements-semantic.txt -r requirements-mcp.txt

      - name: Download the meaning model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2')"

      - name: Test
        run: python -m pytest -p no:warnings

  frontend:
    name: Angular Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: src/frontend

      - name: Build (production)
        run: npm run build -- --configuration production
        working-directory: src/frontend

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t signflow-api:ci src/backend

      - name: Build Frontend image
        run: docker build -t signflow-frontend:ci src/frontend
